<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu</title>
    <style>
        :root {
            --dark-blue: #113663;
            --link-color: var(--dark-blue);
            --link-hover-color: #004499;
            --menu-bg: #d0d0d0;
            --menu-text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--menu-bg);
            color: var(--menu-text);
            padding: 15px;
            margin: 0;
        }

        h1 {
            font-size: 1.5em;
            color: var(--dark-blue);
            border-bottom: 2px solid var(--dark-blue);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            display: block;
            text-decoration: none;
            color: var(--link-color);
            padding: 5px 0;
            font-weight: bold;
            transition: none;
        }

        a:hover {
            color: var(--link-hover-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Benjamin Hill</h1>

    <ul>
        <li><a href="home.html" target="display">Home</a></li>
        <li><a href="resume.html" target="display">Resume & Projects</a></li>
        <li><a href="documents.html" target="display">Additional Documents</a></li>
        <li><a href="reflections.html" target="display">Personal Reflections</a></li>
        <li><a href="contact.html" target="display">Contact Me</a></li>
    </ul>

</body>
</html>
